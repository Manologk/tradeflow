name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib

      - run: flutter analyze

      - run: flutter test

      - name: Load release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRADEFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TRADEFLOW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::TRADEFLOW_KEYSTORE_BASE64 secret not set; APK is debug-signed and cannot update an existing install."
          fi

      - name: Build APK
        env:
          TRADEFLOW_KEYSTORE_PASSWORD: ${{ secrets.TRADEFLOW_KEYSTORE_PASSWORD }}
          TRADEFLOW_KEY_ALIAS: ${{ secrets.TRADEFLOW_KEY_ALIAS }}
          TRADEFLOW_KEY_PASSWORD: ${{ secrets.TRADEFLOW_KEY_PASSWORD }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tradeflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
