name: tradeflow_shop
description: "TradeFlow online shop: browse anime merch and order on WhatsApp."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: EncodeSans
      fonts:
        - asset: assets/fonts/EncodeSans-400.ttf
        - asset: assets/fonts/EncodeSans-500.ttf
          weight: 500
        - asset: assets/fonts/EncodeSans-600.ttf
          weight: 600
        - asset: assets/fonts/EncodeSans-700.ttf
          weight: 700
